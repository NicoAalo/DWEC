<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>8. Ordenar una Lista</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 400px;
            margin: 30px auto;
        }

        ul {
            padding: 0;
            list-style: none;
        }

        li {
            padding: 10px;
            margin-bottom: 6px;
            background: #f4f4f4;
            border-radius: 4px;
            border: 1px solid #ddd;
        }

        button {
            padding: 8px 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <h2>Lista Desordenada</h2>

    <ul id="lista-elementos">
        <li>Zaragoza</li>
        <li>Madrid</li>
        <li>Barcelona</li>
        <li>Asturias</li>
        <li>Valencia</li>
    </ul>

    <button type="button" id="btn-ordenar">Ordenar</button>

    <script src="script.js"></script>
</body>
</html>

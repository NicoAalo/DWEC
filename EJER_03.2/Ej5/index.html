<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>5. Lista de Tareas (To-Do List) Avanzada</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 450px;
            margin: 30px auto;
        }

        .controles {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            padding: 8px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f4f4f4;
            margin-bottom: 8px;
            padding: 10px;
            border-radius: 4px;
        }

        .btn-eliminar {
            background-color: #dc3545;
            padding: 5px 10px;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <h2>Lista de Tareas</h2>

    <div class="controles">
        <input type="text" id="nueva-tarea" placeholder="Escribe una tarea...">
        <button type="button" id="btn-anadir" onclick="anadirTarea()">Añadir</button>
    </div>

    <ul id="lista-tareas"></ul>

    <script src="script.js"></script>
</body>
</html>

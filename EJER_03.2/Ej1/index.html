<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Galería de Imágenes Programada</title>
    <style>
        
        .galeria {
            text-align: center;
            font-family: sans-serif;
            margin-top: 20px;
        }

        #imagen-principal {
            width: 500px;
            height: 300px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .contenedor-miniaturas {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .miniatura {
            width: 110px;
            height: 70px;
            object-fit: cover;
            cursor: pointer;
            border-radius: 4px;
            border: 3px solid transparent;
            transition: 0.2s;
        }

        
        .activa {
            border-color: #007bff;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="galeria">
        
        <div>
            <img id="imagen-principal" src="https://picsum.photos/id/10/500/300" alt="Imagen Principal">
        </div>

        
        <div class="contenedor-miniaturas">
            <img class="miniatura activa" src="https://picsum.photos/id/10/500/300" alt="Miniatura 0" onclick="cambiarImagenPrincipal(0)">
            <img class="miniatura" src="https://picsum.photos/id/20/500/300" alt="Miniatura 1" onclick="cambiarImagenPrincipal(1)">
            <img class="miniatura" src="https://picsum.photos/id/30/500/300" alt="Miniatura 2" onclick="cambiarImagenPrincipal(2)">
            <img class="miniatura" src="https://picsum.photos/id/40/500/300" alt="Miniatura 3" onclick="cambiarImagenPrincipal(3)">
        </div>
    </div>

<script src="script.js"></script>

</body>
</html>

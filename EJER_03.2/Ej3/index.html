<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>3. Informe de Validación de Formulario</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 400px;
            margin: 30px auto;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        #informe-errores {
            margin-top: 15px;
            padding: 10px;
        }
    </style>
</head>
<body>

    <h2>Registro de Usuario</h2>

    <form id="formulario-registro">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" placeholder="Escribe tu nombre">

        <label for="email">Email:</label>
        <input type="text" id="email" placeholder="ejemplo@correo.com">

        <button type="button" onclick="generarInformeDeValidacion()">Validar Formulario</button>
    </form>

    <div id="informe-errores"></div>

    <script src="script.js"></script>
</body>
</html>

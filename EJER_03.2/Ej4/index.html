<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>4. Constructor de Tabla Dinámica</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 500px;
            margin: 30px auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #007bff;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        button {
            padding: 8px 15px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h2>Listado de Usuarios</h2>
    <button type="button" onclick="construirTabla(usuarios)">Generar Tabla</button>

    <div id="contenedor-tabla"></div>

    <script src="script.js"></script>
</body>
</html>

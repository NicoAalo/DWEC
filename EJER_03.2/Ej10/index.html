<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>10. Generador de Lorem Ipsum</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 500px;
            margin: 30px auto;
        }

        .controles {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            padding: 8px;
            width: 100px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            padding: 8px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        #resultado p {
            margin-bottom: 12px;
            line-height: 1.5;
            color: #444;
            text-align: justify;
        }
    </style>
</head>
<body>

    <h2>Generador de Textos</h2>

    <div class="controles">
        <input type="number" id="numero-parrafos" min="1" value="3" placeholder="Nº párrafos">
        <button type="button" id="btn-generar">Generar</button>
    </div>

    <div id="resultado"></div>

    <script src="script.js"></script>
</body>
</html>
